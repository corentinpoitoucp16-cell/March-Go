name: Installer MarchéGo V2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Trouver et décompresser le ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "ZIP trouvé : $ZIP"
          unzip -o "$ZIP" -d /tmp/marchego

      - name: Installer les fichiers MarchéGo
        run: |
          cp -r /tmp/marchego/app .
          cp -r /tmp/marchego/scripts .
          cp /tmp/marchego/build.gradle .
          cp /tmp/marchego/gradle.properties .
          cp /tmp/marchego/settings.gradle .
          cp /tmp/marchego/README.md .

      - name: Supprimer le ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          rm "$ZIP"

      - name: Enregistrer les modifications
        run: |
          git config user.name "MarchéGo"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Installation MarchéGo V2" || exit 0
          git push
